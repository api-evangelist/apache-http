aid: apache-http
name: Apache HttpComponents
description: >-
  Apache HttpComponents is a set of Java HTTP components, including a feature-rich HTTP client (HttpClient 5.x) and HTTP
  server components. It provides connection pooling, async I/O, TLS/SSL support, authentication, cookie management, and
  content negotiation for Java applications making HTTP requests.
