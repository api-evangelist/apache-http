naftiko: 1.0.0-alpha2
info:
  label: Apache HttpComponents Client API — Requests
  description: 'Apache HttpComponents Client API — Requests. 1 operations. Lead operation: Apache HttpComponents Execute Request.
    Self-contained Naftiko capability covering one Apache Http business surface.'
  tags:
  - Apache Http
  - Requests
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_HTTP_API_KEY: APACHE_HTTP_API_KEY
capability:
  consumes:
  - type: http
    namespace: client-requests
    baseUri: https://api.example.com
    description: Apache HttpComponents Client API — Requests business capability. Self-contained, no shared references.
    resources:
    - name: execute
      path: /execute
      operations:
      - name: executerequest
        method: POST
        description: Apache HttpComponents Execute Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: client-requests-rest
    port: 8080
    description: REST adapter for Apache HttpComponents Client API — Requests. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/execute
      name: execute
      description: REST surface for execute.
      operations:
      - method: POST
        name: executerequest
        description: Apache HttpComponents Execute Request
        call: client-requests.executerequest
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: client-requests-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache HttpComponents Client API — Requests. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: apache-httpcomponents-execute-request
      description: Apache HttpComponents Execute Request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: client-requests.executerequest
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
